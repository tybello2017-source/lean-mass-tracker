<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173f5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lean Mass" />
  <title>Lean Mass Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">12-WEEK PROGRAMME</div>
      <h1>Lean Mass Tracker</h1>
    </div>
    <button id="todayBtn" class="ghost">Today</button>
  </header>

  <main id="app">
    <section id="view-today" class="view active"></section>
    <section id="view-meals" class="view"></section>
    <section id="view-workouts" class="view"></section>
    <section id="view-progress" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <button data-view="today" class="active"><span>⌂</span><small>Today</small></button>
    <button data-view="meals"><span>＋</span><small>Meals</small></button>
    <button data-view="workouts"><span>🏋️</span><small>Workout</small></button>
    <button data-view="progress"><span>↗</span><small>Progress</small></button>
    <button data-view="settings"><span>⚙</span><small>Settings</small></button>
  </nav>

  <dialog id="mealDialog">
    <form method="dialog" id="mealForm">
      <div class="dialog-head"><h3>Add meal</h3><button value="cancel" class="icon-btn">✕</button></div>
      <label>Meal slot<select id="mealSlot"><option>Breakfast</option><option>Snack 1</option><option>Lunch</option><option>Snack 2</option><option>Dinner</option><option>Other</option></select></label>
      <label>Search<input id="mealSearch" type="search" placeholder="e.g. rice, yoghurt, Serious Mass" /></label>
      <label>Food<select id="mealSelect"></select></label>
      <div class="two-col">
        <label>Calories<input id="mealKcal" type="number" min="0" step="1" /></label>
        <label>Protein (g)<input id="mealProtein" type="number" min="0" step="0.5" /></label>
      </div>
      <label>Notes<input id="mealNotes" type="text" placeholder="optional" /></label>
      <div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button type="button" id="saveMeal" class="primary">Add</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
